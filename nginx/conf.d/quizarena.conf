upstream quizarena_backend {
    server backend:8000;
    keepalive 32;
}

upstream quizarena_frontend {
    server frontend:80;
    keepalive 16;
}

# Rate limits are also enforced in the FastAPI app; nginx provides edge protection.

server {
    listen 80;
    server_name _;

    # Redirect HTTP to HTTPS when TLS is enabled (uncomment ssl blocks below first).
    # return 301 https://$host$request_uri;

    # listen 443 ssl http2;
    # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location = /api/v1/admin/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://quizarena_backend;
        include /etc/nginx/proxy_params.conf;
    }

    location = /api/v1/join {
        limit_req zone=join_limit burst=10 nodelay;
        proxy_pass http://quizarena_backend;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/ {
        proxy_pass http://quizarena_backend;
        include /etc/nginx/proxy_params.conf;
    }

    location /ws {
        proxy_pass http://quizarena_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /assets/ {
        proxy_pass http://quizarena_frontend;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        proxy_pass http://quizarena_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

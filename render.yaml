# QuizArena — Render Blueprint (backend API)
# https://render.com/docs/blueprint-spec
#
# Pair with:
#   - Neon PostgreSQL (DATABASE_URL)
#   - Vercel frontend (PUBLIC_APP_URL + CORS_ORIGINS)
#
# After first deploy, seed admin once from the Render Shell:
#   python -m scripts.seed_admin

services:
  - type: web
    name: quizarena-api
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/ready
    # WebSockets require a persistent instance (Starter+). Free tier sleeps and drops WS.
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_PATH
        value: /app/storage
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"
      - key: JWT_EXPIRY_HOURS
        value: "8"
      - key: LOGIN_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: JOIN_RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: MAX_UPLOAD_BYTES
        value: "15728640"
      - key: MAX_REQUEST_BODY_BYTES
        value: "20971520"
      # Secrets / deployment-specific — set in the Render dashboard (or sync: false + dashboard)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PUBLIC_APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TRUSTED_HOSTS
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false

    disk:
      name: quizarena-media
      mountPath: /app/storage
      sizeGB: 5
